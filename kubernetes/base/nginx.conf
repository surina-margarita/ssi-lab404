worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    map $http_x_input $mapped_value {
        default "nomatch";
        ~^(?<capture>.+)$ "matched";
    }

    server {
        listen 80;

        location ~ "^/test/(.+)$" {
            add_header X-Debug "$1--$mapped_value--$1" always;
            return 200 "capture=[$1] mapped=[$mapped_value]\n";
        }

        location = /health {
            return 200 "ok\n";
        }

        location / {
            return 200 "Lab 404 nginx\n";
        }
    }
}