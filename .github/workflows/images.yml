name: Security CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "apps/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  TRIVY_VERSION: v0.72.0

jobs:
  # 1. Linting des Dockerfiles
  hadolint:
    name: Lint Dockerfile (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, votes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/${{ matrix.service }}/Dockerfile

  # 2. Build multi-plateforme par digest et publication d'index OCI
  build:
    name: Build ${{ matrix.service }} (${{ matrix.target.arch }})
    needs: hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${{ env.REGISTRY }}/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@v5
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ matrix.target.platform }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 3. Analyse de vulnérabilités par Trivy sur l'image exacte construite
  trivy-scan:
    name: Trivy Scan (${{ matrix.service }} / ${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${{ env.REGISTRY }}/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Scan exact image digest (SARIF & Bloquant)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p reports
          digest="$(basename /tmp/digests/*)"
          image="${IMAGE}@sha256:${digest}"
          
          # Scan SARIF pour GitHub Security
          trivy image \
            --platform "linux/${{ matrix.arch }}" \
            --scanners vuln \
            --format sarif \
            --output "reports/${{ matrix.service }}-${{ matrix.arch }}.sarif" \
            "${image}"

          # Scan bloquant sur vulnérabilités CRITICAL non corrigibles ignorées ou bloquantes
          trivy image \
            --platform "linux/${{ matrix.arch }}" \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${image}"

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'reports/${{ matrix.service }}-${{ matrix.arch }}.sarif'

  # 4. Audit des bonnes pratiques (Dockle) sur l'image exacte
  dockle:
    name: Dockle Audit (${{ matrix.service }} / ${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${{ env.REGISTRY }}/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Pull and save image tarball
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          mkdir -p dockle-work
          digest="$(basename /tmp/digests/*)"
          docker pull --platform "linux/${{ matrix.arch }}" "${IMAGE}@sha256:${digest}"
          docker save --output dockle-work/image.tar "${IMAGE}@sha256:${digest}"

      - name: Run Dockle linter
        uses: goodwithtech/dockle-action@main
        with:
          image: ${{ steps.image.outputs.name }}
          input: dockle-work/image.tar
          failure-code: 1
          exit-level: fatal
          ignore: CIS-DI-0006

  # 5. Fusion et Publication de l'index multi-plateforme final
  merge:
    name: Publish Multi-Arch Index (${{ matrix.service }})
    needs: [trivy-scan, dockle]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, votes]
    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${{ env.REGISTRY }}/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-platform OCI index
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          commit_tag="sha-${GITHUB_SHA::12}"
          tags=(--tag "${IMAGE}:${commit_tag}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${commit_tag}"